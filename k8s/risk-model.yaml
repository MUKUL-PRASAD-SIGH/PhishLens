apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-model
  namespace: phishlens
spec:
  replicas: 2
  selector:
    matchLabels:
      app: risk-model
  template:
    metadata:
      labels:
        app: risk-model
    spec:
      containers:
        - name: risk-model
          image: phishlens/risk-model:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: phishlens-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: risk-model
  namespace: phishlens
spec:
  type: ClusterIP
  selector:
    app: risk-model
  ports:
    - name: http
      port: 8000
      targetPort: http
